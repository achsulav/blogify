services:
  nginx:
    image: nginx:alpine
    container_name: blogify_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./app/SSL:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - blognet

  php:
    build: ./docker/php
    container_name: blogify_php
    restart: always
    volumes:
      - .:/var/www
    env_file:
      - .env.docker
    networks:
      - blognet

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blogify
      MYSQL_USER: phpuser
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - blognet

  node:
    image: node:20
    container_name: blogify_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev"
    env_file:
      - .env.docker
    ports:
      - "5174:5173"
    networks:
      - blognet

  ollama:
    image: ollama/ollama:latest
    container_name: blogify_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - blognet


networks:
  blognet:
    driver: bridge
volumes:
  db_data:
  ollama_data:
